# Run from the Django project root, with the app running and `stripe listen --forward-to` pointing at your webhook.
stripe:
  key: ${STRIPE_TEST_KEY}

app:
  setup: python manage.py billing_e2e setup
  after_subscribe: python manage.py billing_e2e link
  teardown: python manage.py billing_e2e teardown
  clean: python manage.py billing_e2e clean          # run by `billing-e2e clean`

vars:
  monthly_price: price_your_monthly_plan
  upgrade_price: price_a_more_expensive_monthly_plan
