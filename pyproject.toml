[project]
name = "billing-e2e"
version = "0.0.1"
description = "Test your Stripe subscription lifecycle end to end: renewals, failed payments, proration and cancellation in minutes, with test clocks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nouhan Kourouma" }]
requires-python = ">=3.10"
keywords = ["stripe", "billing", "subscriptions", "testing", "test-clocks", "webhooks"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "stripe>=12.0",
]

[project.scripts]
billing-e2e = "billing_e2e.cli:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
