[project]
name = "billing-e2e"
version = "0.1.0"
description = "End-to-end tests for Stripe subscriptions: renewals, failed payments, proration and cancellations on test clocks, checked against your own app."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nouhan Kourouma" }]
requires-python = ">=3.10"
keywords = ["stripe", "billing", "subscriptions", "testing", "e2e", "test-clocks", "webhooks", "proration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "stripe>=12.0,<17",  # each major pins a newer Stripe API version, which can move fields
]

[project.urls]
Homepage = "https://github.com/NKSTUD/billing-e2e"
Issues = "https://github.com/NKSTUD/billing-e2e/issues"
Changelog = "https://github.com/NKSTUD/billing-e2e/blob/main/CHANGELOG.md"

[project.scripts]
billing-e2e = "billing_e2e.cli:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]  # examples/ import the frameworks they show
venvPath = "."
venv = ".venv"
